plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smileengine'
version = '1.0.0'

android {
  namespace "expo.modules.smileengine"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Same Media3 version as expo-video's player, so the app ships a single copy.
  implementation "androidx.media3:media3-transformer:1.9.0"
  implementation "androidx.media3:media3-effect:1.9.0"
  implementation "androidx.media3:media3-common:1.9.0"
}
